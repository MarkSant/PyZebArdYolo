<text x="60" y="640" font-size="10.5" fill="#333">Daily colour change: the 3-module set is moved to another pin (D10–D13), so a different colour pin is energised. Undriven colour pins left n.c.</text>
<text x="60" y="656" font-size="10.5" fill="#a33">As built: no onboard or series resistors; LEDs driven directly from the 5 V digital pins with brief, intermittent cues (see Electrical safety).</text>
