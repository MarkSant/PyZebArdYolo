<text x="160.0" y="191" text-anchor="middle" font-size="16" font-weight="bold">Arduino Uno R3</text>
<text x="160.0" y="210" text-anchor="middle" font-size="11" fill="#555">ATmega328P · powered only via USB</text>
<line x1="260" y1="250" x2="282" y2="250" stroke="#222" stroke-width="2"/>
<circle cx="260" cy="250" r="3" fill="#222"/>
