<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="Helvetica,Arial,sans-serif" role="img">
<rect width="1040" height="660" fill="white"/>
<text x="520" y="30" text-anchor="middle" font-size="19" font-weight="bold">PyZebArdYolo — RGB-LED stimulation circuit (Arduino Uno R3)</text>
<text x="520" y="50" text-anchor="middle" font-size="12.5" fill="#444">Each zone = 3× KY-009 (common-cathode RGB) in parallel; one colour pin per set wired to a digital pin; commons to GND. No series resistors (as built).</text>
